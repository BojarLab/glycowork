name: Deploy to GitHub Pages
on:
  push:
    branches: ["master"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[dev]" nbdev
      - run: nbdev-install-quarto
      - run: nbdev-docs
      - name: Strip inline glycan images from the llms.txt pages
        run: |
          python - <<'EOF'
          import pathlib, re
          for p in pathlib.Path('_docs').rglob('*.llms.md'):
              p.write_text(re.sub(r' ?!\[(?:\\.|[^\]\\])*\]\(data:image/[^;]+;base64,[A-Za-z0-9+/=]*\)', '', p.read_text(encoding = 'utf-8')), encoding = 'utf-8')
          EOF
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_docs
    