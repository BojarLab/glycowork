project:
  type: website
  render:
    - "*.ipynb"
    - "!CONTRIBUTING.md"
  pre-render: python ../bin/docs_dark_glycans.py

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [cosmo, custom.scss, custom-dark.scss]
    respect-user-color-scheme: true
    highlight-style: github
    toc: true
    toc-title: On this page

website:
  llms-txt: true
  twitter-card: true
  open-graph: true
  repo-actions: [issue]
  navbar:
    search: true
    right:
      - icon: github
        href: https://github.com/BojarLab/glycowork
        aria-label: GitHub
  page-footer:
    center: "glycowork · glycan data science from the [Bojar Lab](https://github.com/BojarLab)"
  sidebar:
    style: floating

metadata-files: [nbdev.yml, sidebar.yml]