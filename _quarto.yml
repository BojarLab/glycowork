project:
  type: website
  render:
    - "*.ipynb"
    - "!CONTRIBUTING.md"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true

website:
  llms-txt: true
  twitter-card: true
  open-graph: true
  repo-actions: [issue]
  navbar:
    background: primary
    search: true
  sidebar:
    style: floating

metadata-files: [nbdev.yml, sidebar.yml]